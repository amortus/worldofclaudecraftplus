apply plugin: 'com.android.application'

// Play Integrity cloud project number for native attestation. The env var
// overrides the default; the default keeps parity with upstream. Attestation is
// best-effort: the server only requires it when NATIVE_ATTESTATION_REQUIRED is set.
def playIntegrityCloudProjectNumber = providers
    .environmentVariable("PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER")
    .orElse("865860061593")
    .get()
    .trim()

// Load release signing credentials from key.properties (never committed to git).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.worldofclaudecraft"
    compileSdk = rootProject.ext.compileSdkVersion
    // The hashed media set (dist/media) ships in an install-time Play Asset
    // Delivery pack instead of the base module, so it does not count against the
    // base module download limit. scripts/android_asset_pack.mjs stages the files
    // into ../mediapack after every `npx cap sync android`.
    assetPacks = [":mediapack"]
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.worldofclaudecraft.brasil"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.14.0"
        buildConfigField "long", "PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER", "${playIntegrityCloudProjectNumber}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// `npx cap sync android` wipes and re-copies dist/ into
// app/src/main/assets/public, which puts the hashed media set back in the BASE
// module. scripts/android_asset_pack.mjs (npm run android:pack) moves it into
// the mediapack asset pack afterwards. Forgetting that step is invisible in a
// successful build and would silently push about 55 MiB of compressed media
// back into the base module, so fail the build instead.
def checkMediaAssetPackStaged = tasks.register("checkMediaAssetPackStaged") {
    def strayMedia = file("src/main/assets/public/media")
    def packedMedia = file("../mediapack/src/main/assets/public/media")
    doLast {
        if (strayMedia.exists()) {
            throw new GradleException(
                "The hashed media set is still in the base module at " +
                "android/app/src/main/assets/public/media. Run `npm run android:pack` " +
                "after `npx cap sync android` so it ships in the mediapack asset pack."
            )
        }
        if (!packedMedia.exists() || (packedMedia.listFiles()?.length ?: 0) == 0) {
            throw new GradleException(
                "The mediapack asset pack is empty. Run the native build, " +
                "`npx cap sync android`, then `npm run android:pack` before building."
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(checkMediaAssetPackStaged)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:integrity:1.4.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
